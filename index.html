<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cloud Brawl — Battle</title>
<style>
@font-face {
    font-family: 'Lilita';
    src: url('textures/Lilita.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; width: 100%; height: 100%; }

#joystick {
    position: fixed; bottom: 30px; left: 30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    z-index: 10;
}
#stick {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: translate(-50%, -50%);
}

#shootBtn {
    position: fixed; bottom: 30px; right: 30px;
    width: 100px; height: 100px; border-radius: 50%;
    background: #f44336; color: #fff; border: none;
    font-size: 32px; font-weight: bold;
    z-index: 10;
}
#shootBtn:active { transform: scale(0.95); background: #d32f2f; }

#result {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; z-index: 100;
    font-family: 'Lilita', Arial, sans-serif;
}
#result.on { display: flex; }
#result h1 { font-size: 56px; margin-bottom: 20px; }
#result h1.win { color: #4caf50; }
#result h1.lose { color: #f44336; }
#result p { font-size: 28px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="joystick"><div id="stick"></div></div>
<button id="shootBtn">🔥</button>

<div id="result">
    <h1 id="resultTitle">ПОБЕДА</h1>
    <p id="resultText">+8 🏆</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== ПАРАМЕТРЫ URL =====
const params = new URLSearchParams(window.location.search);
const brawler = parseInt(params.get('brawler')) || 1;

// ===== ТЕКСТУРЫ =====
const TEX = {};
const TEX_LIST = {
    bg: 'textures/bg.png',
    shelly: 'textures/shelly.png',
    shadow: 'textures/shadow.png',
    health: 'textures/health.png',
    health_enemy: 'textures/health_enemy.png',
};
let loaded = 0;
const total = Object.keys(TEX_LIST).length;

for (const [key, path] of Object.entries(TEX_LIST)) {
    const img = new Image();
    img.onload = () => { TEX[key] = img; loaded++; if (loaded === total) start(); };
    img.onerror = () => { TEX[key] = null; loaded++; if (loaded === total) start(); };
    img.src = path;
}

let started = false;
function start() {
    if (started) return;
    started = true;
    loop();
}

// ===== ИГРОК =====
const player = {
    x: W / 2 - 200,
    y: H / 2,
    w: 80,
    h: 80,
    hp: 100,
    maxHp: 100,
    speed: 4,
    lastShot: 0,
    face: 1,
};

// ===== ВРАГ =====
const enemy = {
    x: W / 2 + 120,
    y: H / 2,
    w: 80,
    h: 80,
    hp: 100,
    maxHp: 100,
    speed: 4,
    lastShot: 0,
    face: -1,
    aiTimer: 0,
};

// ===== ПУЛИ =====
const bullets = [];

// ===== УПРАВЛЕНИЕ =====
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

joystick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    const rect = joystick.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}, { passive: false });

joystick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        let dx = t.clientX - joyCenter.x;
        let dy = t.clientY - joyCenter.y;
        const max = 45;
        const dist = Math.hypot(dx, dy);
        if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joyVector.x = dx / max;
        joyVector.y = dy / max;
    }
}, { passive: false });

function endJoy(e) {
    for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        joyId = null;
        joyVector = { x: 0, y: 0 };
        stick.style.transform = 'translate(-50%, -50%)';
    }
}
joystick.addEventListener('touchend', endJoy);
joystick.addEventListener('touchcancel', endJoy);

// ===== СТРЕЛЬБА ИГРОКА =====
const PLAYER_COOLDOWN = 500;
const SHOTGUN_COUNT = 5;
const SHOTGUN_SPREAD = 0.5;
const PLAYER_BULLET_SPEED = 10;
const PLAYER_BULLET_LIFE = 40;
const PLAYER_BULLET_DAMAGE = 8;

function shootAt(target) {
    const now = Date.now();
    if (now - player.lastShot < PLAYER_COOLDOWN) return;
    player.lastShot = now;

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const tx = target.x + target.w / 2;
    const ty = target.y + target.h / 2;
    const baseAngle = Math.atan2(ty - py, tx - px);

    player.face = Math.cos(baseAngle) >= 0 ? 1 : -1;

    for (let i = 0; i < SHOTGUN_COUNT; i++) {
        const angle = baseAngle + (Math.random() - 0.5) * SHOTGUN_SPREAD;
        bullets.push({
            x: px, y: py,
            vx: Math.cos(angle) * PLAYER_BULLET_SPEED,
            vy: Math.sin(angle) * PLAYER_BULLET_SPEED,
            life: PLAYER_BULLET_LIFE,
            owner: 'player',
            damage: PLAYER_BULLET_DAMAGE,
        });
    }
}

document.getElementById('shootBtn').addEventListener('click', () => shootAt(enemy));
document.getElementById('shootBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    shootAt(enemy);
}, { passive: false });

// ===== ВЫСТРЕЛ ВРАГА =====
const ENEMY_COOLDOWN = 700;
const ENEMY_BULLET_SPEED = 8;
const ENEMY_BULLET_LIFE = 60;
const ENEMY_BULLET_DAMAGE = 6;

function enemyShoot() {
    const now = Date.now();
    if (now - enemy.lastShot < ENEMY_COOLDOWN) return;
    enemy.lastShot = now;

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const ex = enemy.x + enemy.w / 2;
    const ey = enemy.y + enemy.h / 2;
    const angle = Math.atan2(py - ey, px - ex);

    enemy.face = Math.cos(angle) >= 0 ? 1 : -1;

    bullets.push({
        x: ex, y: ey,
        vx: Math.cos(angle) * ENEMY_BULLET_SPEED,
        vy: Math.sin(angle) * ENEMY_BULLET_SPEED,
        life: ENEMY_BULLET_LIFE,
        owner: 'enemy',
        damage: ENEMY_BULLET_DAMAGE,
    });
}

// ===== ИИ ВРАГА =====
function updateEnemyAI() {
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const ex = enemy.x + enemy.w / 2;
    const ey = enemy.y + enemy.h / 2;
    const dist = Math.hypot(px - ex, py - ey);

    const hpPercent = enemy.hp / enemy.maxHp;
    let moveX = 0, moveY = 0;

    if (hpPercent < 0.3) {
        // мало HP — отходит
        moveX = (ex - px) / (dist || 1);
        moveY = (ey - py) / (dist || 1);
    } else if (dist > 200) {
        // далеко — идёт к игроку
        moveX = (px - ex) / (dist || 1);
        moveY = (py - ey) / (dist || 1);
    } else if (dist < 120) {
        // близко — отходит немного
        moveX = (ex - px) / (dist || 1);
        moveY = (ey - py) / (dist || 1);
    } else {
        // средняя дистанция — стрейф (боком)
        const perpX = -(py - ey) / (dist || 1);
        const perpY = (px - ex) / (dist || 1);
        enemy.aiTimer -= 16;
        if (enemy.aiTimer <= 0) {
            enemy.aiTimer = 800 + Math.random() * 600;
            enemy.aiDir = Math.random() < 0.5 ? 1 : -1;
        }
        moveX = perpX * (enemy.aiDir || 1);
        moveY = perpY * (enemy.aiDir || 1);
    }

    enemy.x += moveX * enemy.speed;
    enemy.y += moveY * enemy.speed;
    enemy.x = Math.max(0, Math.min(W - enemy.w, enemy.x));
    enemy.y = Math.max(0, Math.min(H - enemy.h, enemy.y));

    enemyShoot();
}

// ===== ОБНОВЛЕНИЕ =====
function update() {
    // движение игрока
    player.x += joyVector.x * player.speed;
    player.y += joyVector.y * player.speed;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    player.y = Math.max(0, Math.min(H - player.h, player.y));

    if (Math.abs(joyVector.x) > 0.1) {
        player.face = joyVector.x > 0 ? 1 : -1;
    }

    updateEnemyAI();

    // пули
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.owner === 'player') {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w &&
                b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= b.damage;
                bullets.splice(i, 1);
                if (enemy.hp <= 0) endBattle(true);
            }
        } else {
            if (b.x > player.x && b.x < player.x + player.w &&
                b.y > player.y && b.y < player.y + player.h) {
                player.hp -= b.damage;
                bullets.splice(i, 1);
                if (player.hp <= 0) endBattle(false);
            }
        }
    }
}

// ===== ОТРИСОВКА HP-БАРА =====
function drawHealthBar(x, y, w, h, hp, maxHp, isEnemy) {
    // тень под баром
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x + 2, y + 2, w, h);

    if (isEnemy) {
        // враг — health_enemy.png (красный, не меняется)
        if (TEX.health_enemy) {
            ctx.drawImage(TEX.health_enemy, x, y, w, h);
        } else {
            ctx.fillStyle = '#333';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#FF4757';
            ctx.fillRect(x, y, w * (hp / maxHp), h);
        }
    } else {
        // игрок — health.png (зелёный → красный)
        const ratio = hp / maxHp;
        const r = Math.round(255 * (1 - ratio));
        const g = Math.round(180 * ratio);
        const color = `rgb(${r},${g},0)`;

        if (TEX.health) {
            // фон баров
            ctx.fillStyle = '#333';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w * ratio, h);
            // рамка из текстуры поверх
            ctx.globalAlpha = 0.9;
            ctx.drawImage(TEX.health, x, y, w, h);
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = '#333';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w * ratio, h);
        }
    }

    // число HP по центру
    const text = Math.max(0, Math.ceil(hp));
    ctx.font = 'bold ' + Math.round(h * 0.7) + 'px "Lilita", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000';
    ctx.strokeText(text, x + w / 2, y + h / 2 + 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x + w / 2, y + h / 2 + 1);
}

// ===== ОТРИСОВКА =====
function draw() {
    // фон
    if (TEX.bg) {
        ctx.drawImage(TEX.bg, 0, 0, W, H);
    } else {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
    }

    // тень врага
    if (TEX.shadow) {
        ctx.globalAlpha = 0.5;
        ctx.drawImage(TEX.shadow, enemy.x - 5, enemy.y + enemy.h - 10, enemy.w + 10, 15);
        ctx.globalAlpha = 1;
    }

    // враг
    if (TEX.shelly) {
        ctx.save();
        if (enemy.face < 0) {
            ctx.translate(enemy.x + enemy.w, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(TEX.shelly, 0, enemy.y, enemy.w, enemy.h);
        } else {
            ctx.drawImage(TEX.shelly, enemy.x, enemy.y, enemy.w, enemy.h);
        }
        ctx.restore();
    } else {
        ctx.fillStyle = '#FF4757';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
    }

    // тень игрока
    if (TEX.shadow) {
        ctx.globalAlpha = 0.5;
        ctx.drawImage(TEX.shadow, player.x - 5, player.y + player.h - 10, player.w + 10, 15);
        ctx.globalAlpha = 1;
    }

    // игрок
    if (TEX.shelly) {
        ctx.save();
        if (player.face < 0) {
            ctx.translate(player.x + player.w, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(TEX.shelly, 0, player.y, player.w, player.h);
        } else {
            ctx.drawImage(TEX.shelly, player.x, player.y, player.w, player.h);
        }
        ctx.restore();
    } else {
        ctx.fillStyle = '#4DA6FF';
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    // HP-бары над головами
    const barW = 100;
    const barH = 18;
    drawHealthBar(enemy.x + enemy.w / 2 - barW / 2, enemy.y - 30, barW, barH, enemy.hp, enemy.maxHp, true);
    drawHealthBar(player.x + player.w / 2 - barW / 2, player.y - 30, barW, barH, player.hp, player.maxHp, false);

    // пули
    for (const b of bullets) {
        ctx.fillStyle = b.owner === 'player' ? '#4DA6FF' : '#FF4757';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ===== ЦИКЛ =====
let battleEnded = false;
function loop() {
    if (!battleEnded) {
        update();
        draw();
    }
    requestAnimationFrame(loop);
}

// ===== КОНЕЦ БОЯ =====
function endBattle(win) {
    if (battleEnded) return;
    battleEnded = true;

    const trophies = win ? 8 : -5;

    const result = document.getElementById('result');
    const title = document.getElementById('resultTitle');
    const text = document.getElementById('resultText');
    title.textContent = win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
    title.className = win ? 'win' : 'lose';
    text.textContent = (win ? '+' : '') + trophies + ' 🏆';
    result.classList.add('on');

    setTimeout(() => {
        window.location.hash = (win ? 'win_' : 'lose_') + trophies;
    }, 1500);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cloud Brawl — Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
canvas { display: block; width: 100%; height: 100%; }

#hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; color: #fff; font-weight: bold;
    z-index: 10; pointer-events: none;
}
.hp-bar {
    width: 40%; height: 20px; background: #333; border-radius: 10px;
    overflow: hidden; border: 2px solid #000;
}
.hp-fill {
    height: 100%; background: #4caf50; transition: width 0.2s;
}
.hp-fill.enemy { background: #f44336; }
.hp-text { font-size: 12px; margin-top: 4px; }

#joystick {
    position: fixed; bottom: 30px; left: 30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    z-index: 10;
}
#stick {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: translate(-50%, -50%);
}

#shootBtn {
    position: fixed; bottom: 30px; right: 30px;
    width: 100px; height: 100px; border-radius: 50%;
    background: #f44336; color: #fff; border: none;
    font-size: 16px; font-weight: bold;
    z-index: 10;
}
#shootBtn:active { transform: scale(0.95); background: #d32f2f; }

#result {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; z-index: 100;
}
#result.on { display: flex; }
#result h1 { font-size: 48px; margin-bottom: 20px; }
#result h1.win { color: #4caf50; }
#result h1.lose { color: #f44336; }
#result p { font-size: 24px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
    <div>
        <div class="hp-bar"><div class="hp-fill" id="myHp"></div></div>
        <div class="hp-text" id="myHpText">100 / 100</div>
    </div>
    <div style="text-align:right">
        <div class="hp-bar"><div class="hp-fill enemy" id="enemyHp"></div></div>
        <div class="hp-text" id="enemyHpText">100 / 100</div>
    </div>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="shootBtn">🔥</button>

<div id="result">
    <h1 id="resultTitle">ПОБЕДА</h1>
    <p id="resultText">+8 🏆</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== ПАРАМЕТРЫ URL =====
const params = new URLSearchParams(window.location.search);
const brawler = parseInt(params.get('brawler')) || 1;

// ===== ИГРОК =====
const player = {
    x: W / 2 - 100,
    y: H / 2,
    w: 40,
    h: 40,
    hp: 100,
    maxHp: 100,
    speed: 4,
    color: '#4DA6FF',
    lastShot: 0,
};

// ===== ВРАГ =====
const enemy = {
    x: W / 2 + 100,
    y: H / 2,
    w: 40,
    h: 40,
    hp: 100,
    maxHp: 100,
    speed: 2,
    color: '#FF4757',
    lastShot: 0,
    targetX: W / 2 + 100,
    targetY: H / 2,
    changeDirTimer: 0,
};

// ===== ПУЛИ =====
const bullets = [];

// ===== УПРАВЛЕНИЕ =====
let joyActive = false;
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

joystick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    joyActive = true;
    const rect = joystick.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}, { passive: false });

joystick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        let dx = t.clientX - joyCenter.x;
        let dy = t.clientY - joyCenter.y;
        const max = 45;
        const dist = Math.hypot(dx, dy);
        if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joyVector.x = dx / max;
        joyVector.y = dy / max;
    }
}, { passive: false });

function endJoy(e) {
    for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        joyActive = false;
        joyId = null;
        joyVector = { x: 0, y: 0 };
        stick.style.transform = 'translate(-50%, -50%)';
    }
}
joystick.addEventListener('touchend', endJoy);
joystick.addEventListener('touchcancel', endJoy);

// ===== СТРЕЛЬБА =====
const SHOOT_COOLDOWN = 500;
const SHOTGUN_COUNT = 5;
const SHOTGUN_SPREAD = 0.4;
const BULLET_SPEED = 10;
const BULLET_LIFE = 40;

function shoot() {
    const now = Date.now();
    if (now - player.lastShot < SHOOT_COOLDOWN) return;
    player.lastShot = now;

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const ex = enemy.x + enemy.w / 2;
    const ey = enemy.y + enemy.h / 2;
    const baseAngle = Math.atan2(ey - py, ex - px);

    for (let i = 0; i < SHOTGUN_COUNT; i++) {
        const angle = baseAngle + (Math.random() - 0.5) * SHOTGUN_SPREAD;
        bullets.push({
            x: px, y: py,
            vx: Math.cos(angle) * BULLET_SPEED,
            vy: Math.sin(angle) * BULLET_SPEED,
            life: BULLET_LIFE,
            owner: 'player',
            damage: 12,
        });
    }
}

document.getElementById('shootBtn').addEventListener('click', shoot);
document.getElementById('shootBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    shoot();
}, { passive: false });

// ===== ВЫСТРЕЛ ВРАГА =====
function enemyShoot() {
    const now = Date.now();
    if (now - enemy.lastShot < 1200) return;
    enemy.lastShot = now;

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const ex = enemy.x + enemy.w / 2;
    const ey = enemy.y + enemy.h / 2;
    const angle = Math.atan2(py - ey, px - ex);

    bullets.push({
        x: ex, y: ey,
        vx: Math.cos(angle) * 6,
        vy: Math.sin(angle) * 6,
        life: 60,
        owner: 'enemy',
        damage: 8,
    });
}

// ===== ОБНОВЛЕНИЕ =====
function update() {
    // движение игрока
    player.x += joyVector.x * player.speed;
    player.y += joyVector.y * player.speed;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    player.y = Math.max(0, Math.min(H - player.h, player.y));

    // движение врага (простое — идёт к игроку)
    enemy.changeDirTimer -= 16;
    if (enemy.changeDirTimer <= 0) {
        enemy.changeDirTimer = 1000 + Math.random() * 1000;
        enemy.targetX = player.x;
        enemy.targetY = player.y;
    }
    const dx = (enemy.targetX - enemy.x);
    const dy = (enemy.targetY - enemy.y);
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > 100) {
        enemy.x += dx / dist * enemy.speed;
        enemy.y += dy / dist * enemy.speed;
    }
    enemy.x = Math.max(0, Math.min(W - enemy.w, enemy.x));
    enemy.y = Math.max(0, Math.min(H - enemy.h, enemy.y));

    enemyShoot();

    // пули
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
            bullets.splice(i, 1);
            continue;
        }

        // попадание
        if (b.owner === 'player') {
            if (b.x > enemy.x && b.x < enemy.x + enemy.w &&
                b.y > enemy.y && b.y < enemy.y + enemy.h) {
                enemy.hp -= b.damage;
                bullets.splice(i, 1);
                if (enemy.hp <= 0) endBattle(true);
            }
        } else {
            if (b.x > player.x && b.x < player.x + player.w &&
                b.y > player.y && b.y < player.y + player.h) {
                player.hp -= b.damage;
                bullets.splice(i, 1);
                if (player.hp <= 0) endBattle(false);
            }
        }
    }

    // HUD
    document.getElementById('myHp').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('enemyHp').style.width = (enemy.hp / enemy.maxHp * 100) + '%';
    document.getElementById('myHpText').textContent = Math.max(0, player.hp) + ' / ' + player.maxHp;
    document.getElementById('enemyHpText').textContent = Math.max(0, enemy.hp) + ' / ' + enemy.maxHp;
}

// ===== ОТРИСОВКА =====
function draw() {
    // фон
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    // игрок
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 10, player.y + 10, 8, 8);
    ctx.fillRect(player.x + 22, player.y + 10, 8, 8);

    // враг
    ctx.fillStyle = enemy.color;
    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(enemy.x + 10, enemy.y + 10, 8, 8);
    ctx.fillRect(enemy.x + 22, enemy.y + 10, 8, 8);

    // пули
    for (const b of bullets) {
        ctx.fillStyle = b.owner === 'player' ? '#4DA6FF' : '#FF4757';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ===== ЦИКЛ =====
let battleEnded = false;
function loop() {
    if (!battleEnded) {
        update();
        draw();
    }
    requestAnimationFrame(loop);
}
loop();

// ===== КОНЕЦ БОЯ =====
function endBattle(win) {
    if (battleEnded) return;
    battleEnded = true;

    const trophies = win ? 8 : -5;

    // показываем экран
    const result = document.getElementById('result');
    const title = document.getElementById('resultTitle');
    const text = document.getElementById('resultText');
    title.textContent = win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
    title.className = win ? 'win' : 'lose';
    text.textContent = (win ? '+' : '') + trophies + ' 🏆';
    result.classList.add('on');

    // МОСТ — через hash
    setTimeout(() => {
        window.location.hash = (win ? 'win_' : 'lose_') + trophies;
    }, 1500);
}
</script>
</body>
</html>

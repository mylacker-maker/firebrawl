<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title></title>
<style>
  @font-face { font-family: 'Lilita'; src: url('textures/Lilita.ttf'); }
  @font-face { font-family: 'Pusia';  src: url('textures/Pusia.ttf'); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* ================= ПАРАМЕТРЫ ИЗ ССЫЛКИ ================= */
const qs = new URLSearchParams(location.search);
const PLAYER_NAME = (qs.get('name') || 'Player').slice(0, 20);
let   BRAWLER_ID  = parseInt(qs.get('brawler'), 10);
let   LVL         = parseInt(qs.get('lvl'), 10);
if (!(LVL >= 1)) LVL = 1;
LVL = Math.max(1, Math.min(11, LVL));

/* ================= ТЕКСТУРЫ / БОЙЦЫ ================= */
const TEX = 'textures/';

// Каждый боец: id -> настройки. Добавляйте новых бойцов сюда.
const BRAWLERS = {
  1: {
    tex: 'shelly',                 // textures/shelly.png
    bullet: 'shelly_bullet',       // textures/shelly_bullet.png
    sound: 'shelly',               // textures/shelly.mp3
    hp: 6500,
    hpPerLvl: 65,                  // +HP за каждый уровень силы
    dmg: (lvl) => 890 + 40 * lvl,
    reload: 1.6,                   // секунды
    range: 452.4,                  // дальность волны (520 - 13%)
    bulletSpeed: 950,
    bulletW: 152,                  // ширина спрайта волны (160 - 5%)
    bulletRadius: 58.9,            // радиус попадания волны
    shots: 1, burstInterval: 0, spread: 0,
    height: 150                    // высота бойца на экране
  },
  2: {
    tex: 'colt',
    bullet: 'colt_bullet',
    sound: 'colt',                 // один раз за одно нажатие атаки
    hp: 5200,
    hpPerLvl: 75,
    dmg: (lvl) => 140 + 10 * lvl,  // урон одного патрона
    reload: 1.1,
    range: 520,                    // как была у Shelly раньше
    bulletSpeed: 1150,
    bulletW: 64,                   // маленький, но не слишком
    bulletRadius: 22,
    shots: 4, burstInterval: 0.075, spread: 0.025,   // очередь из 4 патронов
    height: 150
  },
  3: {
    tex: 'nita',
    bullet: 'bots_bullet',
    sound: 'nita',
    hp: 4750,
    hpPerLvl: 50,
    dmg: (lvl) => 900 + 65 * lvl,
    reload: 1.8,
    range: 384.5,                  // дальность Shelly сейчас - 15%
    bulletSpeed: 807.5,            // на 15% медленнее Shelly
    bulletW: 152,                  // как у Shelly
    bulletRadius: 58.9,
    shots: 1, burstInterval: 0, spread: 0,
    height: 150
  }
};
if (!BRAWLERS[BRAWLER_ID]) BRAWLER_ID = 1;
const IDS = Object.keys(BRAWLERS).map(Number);


/* ================= ЗАГРУЗКА ================= */
const images = {};
const tints = {};   // белые силуэты и затемнённые версии
const sounds = {};

function loadImage(key) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { images[key] = img; res(); };
    img.onerror = () => res();
    img.src = TEX + key + '.png';
  });
}
function loadSound(key) {
  if (sounds[key]) return;
  const a = new Audio(TEX + key + '.mp3');
  a.preload = 'auto';
  sounds[key] = a;
}
function playSound(key) {
  const a = sounds[key];
  if (!a) return;
  try {
    const c = a.cloneNode();
    c.volume = 0.8;
    const p = c.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function makeTint(img, color) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = color;
  x.fillRect(0, 0, c.width, c.height);
  return c;
}

/* ================= CANVAS ================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const WORLD_W = 1280, WORLD_H = 720;
let S = 1, OX = 0, OY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  S = Math.min(W / WORLD_W, H / WORLD_H);
  OX = (W - WORLD_W * S) / 2;
  OY = (H - WORLD_H * S) / 2;
}
window.addEventListener('resize', resize);
resize();

/* ================= СОСТОЯНИЕ ================= */
const BODY_R = 38;
const BODY_OFF = 60; // центр тела выше ног
// Барьеры только по краям экрана
function getBounds(f) {
  const img = images[f.def.tex];
  const h = f.def.height;
  const w = img ? h * img.width / img.height : h * 0.7;
  const minX = -OX / S, maxX = (W - OX) / S;
  const minY = -OY / S, maxY = (H - OY) / S;
  return { x1: minX + w / 2 + 4, x2: maxX - w / 2 - 4, y1: minY + h + 80, y2: maxY - 14 };
}

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function makeFighter(id, lvl, x, y, name, isEnemy) {
  const def = BRAWLERS[id];
  return {
    id, def, lvl, name, isEnemy,
    x, y, vx: 0, vy: 0,
    hp: def.hp + def.hpPerLvl * lvl, maxHp: def.hp + def.hpPerLvl * lvl,
    cd: 0,
    flash: 0, dead: false, deathT: 0,
    ai: { t: rand(0.3, 1), strafe: Math.random() < 0.5 ? 1 : -1, pending: false, fireAt: 0 }
  };
}
const cen = (f) => ({ x: f.x, y: f.y - BODY_OFF });

let player, enemy;
let bullets = [];
let effects = [];
let over = false;
let frozen = false;
let time = 0;

function enemyLevel() {
  if (LVL <= 1) return 1;                         // 1 -> у врага тоже 1
  const r = Math.random();
  if (r < 0.10) return Math.min(11, LVL + 1);     // небольшой шанс: на 1 сила больше
  if (r < 0.45) return LVL;                       // такая же сила как у нас
  return 1 + Math.floor(Math.random() * LVL);     // любой уровень от 1 до нашего
}

/* ================= БОЙ ================= */
function spawnBullet(shooter, angle, react) {
  const d = shooter.def;
  const c = cen(shooter);
  bullets.push({
    x: c.x + Math.cos(angle) * 40,
    y: c.y + Math.sin(angle) * 40,
    a: angle,
    vx: Math.cos(angle) * d.bulletSpeed,
    vy: Math.sin(angle) * d.bulletSpeed,
    traveled: 0,
    owner: shooter,
    dmg: d.dmg(shooter.lvl),
    def: d,
    radius: d.bulletRadius,
    react
  });
}

function fire(shooter, angle) {
  const d = shooter.def;
  shooter.cd = d.reload;
  shooter.burst = { angle, left: d.shots, t: 0, react: Math.random() < 0.72 };
  playSound(d.sound); // один раз за атаку
}

function processBurst(f, dt) {
  const b = f.burst;
  if (!b || over) return;
  b.t -= dt;
  while (b.left > 0 && b.t <= 0) {
    const sp = f.def.spread ? rand(-f.def.spread, f.def.spread) : 0;
    spawnBullet(f, b.angle + sp, b.react);
    b.left--;
    b.t += f.def.burstInterval;
  }
  if (b.left <= 0) f.burst = null;
}

function playerAttack() {
  if (over || player.dead || player.cd > 0) return;
  const p = cen(player), e = cen(enemy);
  fire(player, Math.atan2(e.y - p.y, e.x - p.x));
}

function playResult(key, hash) {
  let done = false;
  const finish = () => { if (done) return; done = true; location.hash = hash; };
  const a = sounds[key];
  if (!a) { setTimeout(finish, 500); return; }
  try {
    a.loop = false;
    a.currentTime = 0;
    a.addEventListener('ended', finish);
    a.addEventListener('error', finish);
    const p = a.play();
    if (p && p.catch) p.catch(() => setTimeout(finish, 500));
  } catch (e) { setTimeout(finish, 500); }
  setTimeout(finish, 30000); // страховка
}

let battleOn = false;
function ensureBattle() {
  const a = sounds['battle'];
  if (!a || over || battleOn) return;
  a.loop = true;
  a.volume = 0.5;
  const p = a.play();
  if (p && p.then) p.then(() => { battleOn = true; }).catch(() => {});
  else battleOn = true;
}
function stopBattle() {
  const a = sounds['battle'];
  battleOn = true; // больше не запускать
  if (a) { try { a.pause(); } catch (e) {} }
}

function addEffect(x, y, type) {
  effects.push({ x, y, t: 0, dur: type === 'death' ? 0.5 : 0.25, type });
}

function damage(target, amount, hx, hy) {
  if (target.dead || over) return;
  target.hp -= amount;
  target.flash = 0.18;
  addEffect(hx, hy, 'hit');
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    target.deathT = 0;
    over = true;
    const c = cen(target);
    addEffect(c.x, c.y, 'death');
    stopBattle();
    setTimeout(() => { frozen = true; }, 500);
    if (target === player) playResult('lost', '#lost');
    else playResult('win', '#win');
  }
}

/* ================= ИИ ВРАГА ================= */
function aiUpdate(dt) {
  const e = enemy, p = player;
  const ec = cen(e), pc = cen(p);
  let dx = pc.x - ec.x, dy = pc.y - ec.y;
  const dist = Math.hypot(dx, dy) || 1;
  const nx = dx / dist, ny = dy / dist;
  const px = -ny, py = nx;
  const range = e.def.range;

  e.ai.t -= dt;
  if (e.ai.t <= 0) {
    if (Math.random() < 0.6) e.ai.strafe *= -1;
    e.ai.t = rand(0.7, 2.0);
  }

  const pReady = p.cd <= 0.15;
  const eReady = e.cd <= 0;
  const hpr = e.hp / e.maxHp;

  let ideal;
  if (eReady && !pReady)      ideal = range * 0.55;  // игрок перезаряжается — давим
  else if (eReady && pReady)  ideal = range * 0.82;  // оба готовы — дуэль на краю
  else if (!eReady && pReady) ideal = range * 1.25;  // мы перезаряжаемся — отходим
  else                        ideal = range * 0.9;
  if (hpr < 0.3) ideal += 60;                        // осторожнее при низком здоровье, но бой продолжает

  const radial = clamp((dist - ideal) / 120, -1, 1);
  let mx = nx * radial + px * e.ai.strafe * 0.8 * (1 - Math.abs(radial) * 0.5);
  let my = ny * radial + py * e.ai.strafe * 0.8 * (1 - Math.abs(radial) * 0.5);

  // уклонение от волн игрока
  for (const b of bullets) {
    if (b.owner !== p || !b.react) continue;
    const rx = ec.x - b.x, ry = ec.y - b.y;
    const cs = Math.cos(b.a), sn = Math.sin(b.a);
    const along = rx * cs + ry * sn;
    if (along > -20 && along < 430) {
      const cr = -rx * sn + ry * cs;
      if (Math.abs(cr) < b.radius + 55) {
        let side = cr >= 0 ? 1 : -1;
        mx += -sn * side * 2.2; // уход вбок от траектории волны
        my += cs * side * 2.2;
      }
    }
  }

  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }

  const speed = 267.05;
  const tvx = mx * speed, tvy = my * speed;
  const k = Math.min(1, dt * 6);
  e.vx += (tvx - e.vx) * k;
  e.vy += (tvy - e.vy) * k;

  // стрельба с упреждением
  if (eReady && dist < range * 0.93) {
    if (!e.ai.pending) { e.ai.pending = true; e.ai.fireAt = time + rand(0.12, 0.4); }
    if (e.ai.pending && time >= e.ai.fireAt) {
      let tt = dist / e.def.bulletSpeed;
      let ax = pc.x, ay = pc.y;
      for (let i = 0; i < 2; i++) {
        ax = pc.x + p.vx * tt * 0.85;
        ay = pc.y + p.vy * tt * 0.85;
        tt = Math.hypot(ax - ec.x, ay - ec.y) / e.def.bulletSpeed;
      }
      const ang = Math.atan2(ay - ec.y, ax - ec.x) + rand(-0.04, 0.04);
      fire(e, ang);
      e.ai.pending = false;
    }
  } else if (e.ai.pending && dist > range * 0.97) {
    e.ai.pending = false;
  }
}

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt) {
  time += dt;

  // эффекты и смерть идут всегда
  for (const e of effects) e.t += dt;
  effects = effects.filter((e) => e.t < e.dur);
  for (const f of [player, enemy]) {
    if (f.flash > 0) f.flash -= dt;
    if (f.dead) f.deathT += dt;
  }
  if (over) return;

  // игрок
  let mx = input.mx, my = input.my;
  const k = input.keys;
  if (k['a'] || k['arrowleft'])  mx -= 1;
  if (k['d'] || k['arrowright']) mx += 1;
  if (k['w'] || k['arrowup'])    my -= 1;
  if (k['s'] || k['arrowdown'])  my += 1;
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  const ps = 305.2;
  player.vx = mx * ps; player.vy = my * ps;

  if (player.cd > 0) player.cd = Math.max(0, player.cd - dt);
  if (enemy.cd > 0)  enemy.cd  = Math.max(0, enemy.cd - dt);

  aiUpdate(dt);

  for (const f of [player, enemy]) {
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    const B = getBounds(f);
    if (f.x < B.x1) { f.x = B.x1; if (f.vx < 0) f.vx = 0; }
    if (f.x > B.x2) { f.x = B.x2; if (f.vx > 0) f.vx = 0; }
    if (f.y < B.y1) { f.y = B.y1; if (f.vy < 0) f.vy = 0; }
    if (f.y > B.y2) { f.y = B.y2; if (f.vy > 0) f.vy = 0; }
  }

  // очереди выстрелов
  for (const f of [player, enemy]) processBurst(f, dt);

  // пули
  for (const b of bullets) {
    const step = b.def.bulletSpeed * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.traveled += step;
    const target = b.owner === player ? enemy : player;
    const tc = cen(target);
    if (!over && !target.dead && Math.hypot(tc.x - b.x, tc.y - b.y) < b.radius + BODY_R) {
      b.dead = true;
      damage(target, b.dmg, tc.x, tc.y);
    }
    if (b.traveled >= b.def.range) b.dead = true;
  }
  bullets = bullets.filter((b) => !b.dead);
}

/* ================= ОТРИСОВКА ================= */
function drawText(text, x, y, font, size) {
  ctx.font = size + 'px ' + font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.25);
  ctx.strokeStyle = '#000';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x, y);
}

function drawBackground() {
  const bg = images['bg'];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (bg) {
    const sc = Math.max(W / bg.width, H / bg.height);
    const w = bg.width * sc, h = bg.height * sc;
    ctx.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawFighter(f) {
  const img = images[f.def.tex];
  if (!img) return;
  const h = f.def.height;
  const w = h * img.width / img.height; // без растяжения

  let sc = 1, alpha = 1, whiteA = 0;
  if (f.dead) {
    const p = clamp(f.deathT / 0.45, 0, 1);
    sc = p < 0.25 ? 1 + p * 1.2 : 1.3 * (1 - (p - 0.25) / 0.75);
    alpha = 1 - p * p;
    whiteA = 0.9 * (1 - p);
    if (p >= 1) return;
  }

  // тень
  const sh = images['shadow'];
  if (sh) {
    const sw = w * 0.9;
    const shh = sw * sh.height / sh.width;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(sh, f.x - sw / 2 * sc, f.y - shh * 0.5 * sc, sw * sc, shh * sc);
    ctx.restore();
  }

  const fl = f.flash > 0 ? f.flash / 0.18 : 0;
  const sx = 1 + 0.08 * fl, sy = 1 - 0.08 * fl;
  const shake = Math.sin(time * 90) * 4 * fl;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(f.x + shake, f.y);
  ctx.scale(sx * sc, sy * sc);
  ctx.drawImage(img, -w / 2, -h, w, h);
  const white = tints[f.def.tex + '_white'];
  const wa = Math.max(whiteA, 0.75 * fl);
  if (white && wa > 0) {
    ctx.globalAlpha = wa * alpha;
    ctx.drawImage(white, -w / 2, -h, w, h);
  }
  ctx.restore();
}

function drawBars(f) {
  if (f.dead) return;
  const img = images[f.isEnemy ? 'health_enemy' : 'health'];
  const h = f.def.height;
  let barW = 120, barH = 36;
  if (img) barH = barW * img.height / img.width;
  const bx = f.x, by = f.y - h - 10 - barH / 2;
  if (img) ctx.drawImage(img, bx - barW / 2, by - barH / 2, barW, barH);
  drawText(String(Math.ceil(f.hp)), bx, by + 1, 'Lilita', Math.round(barH * 0.42));
  drawText(f.name, bx, by - barH / 2 - 14, 'Pusia', 22);
}

function drawBullet(b) {
  const img = images[b.def.bullet];
  if (!img) return;
  const w = b.def.bulletW;
  const h = w * img.height / img.width;
  const left = 1 - b.traveled / b.def.range;
  ctx.save();
  ctx.globalAlpha = clamp(left * 3, 0, 1);
  ctx.translate(b.x, b.y);
  ctx.rotate(b.a);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function drawEffect(e) {
  const p = e.t / e.dur;
  ctx.save();
  ctx.strokeStyle = '#fff';
  if (e.type === 'hit') {
    // ударная волна + вспышка
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.lineWidth = 10 * (1 - p) + 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 20 + 55 * p, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = (1 - p) * (1 - p) * 0.7;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 28 * (1 - p * 0.5), 0, Math.PI * 2);
    ctx.fill();
  } else {
    // смерть: двойная ударная волна
    ctx.globalAlpha = (1 - p) * 0.95;
    ctx.lineWidth = 16 * (1 - p) + 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 30 + 170 * p, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 8 * (1 - p) + 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 15 + 100 * p, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = (1 - p) * (1 - p) * 0.8;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 60 * (1 - p), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function btnGeom() {
  const r = Math.min(W, H) * 0.12;
  return { r, cx: W - r - W * 0.04, cy: H - r - H * 0.06 };
}

function drawAttackButton() {
  const img = images['attack'];
  if (!img) return;
  const g = btnGeom();
  const size = g.r * 2;
  const w = size, h = size * img.height / img.width; // пропорции сохраняем
  const x = g.cx - w / 2, y = g.cy - h / 2;
  const reload = player.def.reload;
  const progress = player.cd <= 0 ? 1 : 1 - player.cd / reload;

  if (progress >= 1) {
    ctx.drawImage(img, x, y, w, h);
    return;
  }
  const dark = tints['attack_dark'];
  ctx.drawImage(dark || img, x, y, w, h);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g.cx, g.cy);
  ctx.arc(g.cx, g.cy, Math.max(w, h), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function render() {
  drawBackground();

  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  const list = [player, enemy].sort((a, b) => a.y - b.y);
  for (const f of list) drawFighter(f);
  for (const b of bullets) drawBullet(b);
  for (const f of list) drawBars(f);
  for (const e of effects) drawEffect(e);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawJoystick();
  drawAttackButton();
}

/* ================= ДЖОЙСТИК ================= */
function joyR() { return Math.min(W, H) * 0.13; }
function joyIdle() { const r = joyR(); return { x: r + W * 0.05, y: H - r - H * 0.08 }; }
let joy = null; // {id, cx, cy, kx, ky}

function drawJoystick() {
  const R = joyR();
  const c = joy ? { x: joy.cx, y: joy.cy } : joyIdle();
  const k = joy ? { x: joy.kx, y: joy.ky } : c;
  const active = !!joy;
  ctx.save();

  // основание
  ctx.shadowColor = 'rgba(0,120,255,0.8)';
  ctx.shadowBlur = active ? 28 : 16;
  let g = ctx.createRadialGradient(c.x, c.y, R * 0.2, c.x, c.y, R);
  g.addColorStop(0, 'rgba(40,120,255,0.18)');
  g.addColorStop(1, 'rgba(20,70,220,' + (active ? 0.55 : 0.4) + ')');
  ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = R * 0.09; ctx.strokeStyle = '#06174f'; ctx.stroke();
  ctx.beginPath(); ctx.arc(c.x, c.y, R * 0.965, 0, Math.PI * 2);
  ctx.lineWidth = R * 0.04; ctx.strokeStyle = 'rgba(150,210,255,0.9)'; ctx.stroke();

  // внутреннее кольцо
  ctx.beginPath(); ctx.arc(c.x, c.y, R * 0.62, 0, Math.PI * 2);
  ctx.lineWidth = R * 0.025; ctx.strokeStyle = 'rgba(150,210,255,0.35)'; ctx.stroke();

  // стрелки
  ctx.fillStyle = 'rgba(190,230,255,0.75)';
  const a = R * 0.82, s2 = R * 0.07;
  [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => {
    const px = c.x + dx * a, py = c.y + dy * a;
    ctx.beginPath();
    ctx.moveTo(px + dx * s2, py + dy * s2);
    ctx.lineTo(px - dx * s2 + dy * s2 * 1.4, py - dy * s2 + dx * s2 * 1.4);
    ctx.lineTo(px - dx * s2 - dy * s2 * 1.4, py - dy * s2 - dx * s2 * 1.4);
    ctx.closePath(); ctx.fill();
  });

  // шарик
  const kr = R * 0.42;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  g = ctx.createRadialGradient(k.x - kr * 0.3, k.y - kr * 0.4, kr * 0.1, k.x, k.y, kr);
  g.addColorStop(0, '#9be0ff');
  g.addColorStop(0.45, '#2f84ff');
  g.addColorStop(1, '#0b3fb8');
  ctx.beginPath(); ctx.arc(k.x, k.y, kr, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.lineWidth = kr * 0.16; ctx.strokeStyle = '#06174f'; ctx.stroke();
  ctx.beginPath(); ctx.arc(k.x, k.y, kr * 0.84, Math.PI * 1.05, Math.PI * 1.75);
  ctx.lineWidth = kr * 0.1; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.stroke();
  ctx.restore();
}

/* ================= ВВОД ================= */
const input = { mx: 0, my: 0, keys: {} };

canvas.addEventListener('pointerdown', (e) => {
  if (frozen) return;
  ensureBattle();
  const g = btnGeom();
  if (Math.hypot(e.clientX - g.cx, e.clientY - g.cy) <= g.r * 1.15) {
    playerAttack();
    return;
  }
  if (e.clientX < W * 0.6 && !joy) {
    joy = { id: e.pointerId, cx: e.clientX, cy: e.clientY, kx: e.clientX, ky: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!joy || joy.id !== e.pointerId) return;
  const R = joyR(), maxR = R * 0.75;
  let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy;
  const d = Math.hypot(dx, dy);
  if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
  joy.kx = joy.cx + dx; joy.ky = joy.cy + dy;
  const m = Math.hypot(dx, dy);
  if (m < R * 0.08) { input.mx = 0; input.my = 0; return; }
  input.mx = dx / maxR; input.my = dy / maxR;
});
function endJoy(e) {
  if (joy && joy.id === e.pointerId) { joy = null; input.mx = 0; input.my = 0; }
}
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);
window.addEventListener('keydown', (e) => {
  ensureBattle();
  const k = e.key.toLowerCase();
  input.keys[k] = true;
  if (k === ' ' && !frozen) { e.preventDefault(); playerAttack(); }
});
window.addEventListener('keyup', (e) => { input.keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ================= СТАРТ ================= */
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  render();
  if (!frozen) requestAnimationFrame(loop);
}

async function start() {
  const enemyId = IDS[Math.floor(Math.random() * IDS.length)];
  player = makeFighter(BRAWLER_ID, LVL, 260, 470, PLAYER_NAME, false);
  enemy  = makeFighter(enemyId, enemyLevel(), WORLD_W - 260, 470,
            'Бот', true);

  const keys = ['bg', 'shadow', 'health', 'health_enemy', 'attack'];
  for (const id of IDS) {
    keys.push(BRAWLERS[id].tex, BRAWLERS[id].bullet);
    loadSound(BRAWLERS[id].sound);
  }
  loadSound('battle'); loadSound('win'); loadSound('lost');
  const fonts = [
    document.fonts ? document.fonts.load('20px Lilita') : null,
    document.fonts ? document.fonts.load('20px Pusia') : null
  ].filter(Boolean);

  await Promise.all([...keys.map(loadImage), ...fonts.map((p) => p.catch(() => {}))]);

  for (const id of IDS) {
    const t = BRAWLERS[id].tex;
    if (images[t]) tints[t + '_white'] = makeTint(images[t], '#ffffff');
  }
  if (images['attack']) tints['attack_dark'] = makeTint(images['attack'], 'rgba(0,0,0,0.6)');

  ensureBattle();
  requestAnimationFrame((ts) => { last = ts; loop(ts); });
}
start();
})();
</script>
